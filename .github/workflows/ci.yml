name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate content and exercise solutions
        shell: pwsh
        run: |
          python -u tools/validate_content.py 2>&1 | Tee-Object -FilePath validate.log
          $code = $LASTEXITCODE
          Get-Content validate.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Smoke test local API
        shell: pwsh
        run: |
          $env:PYL2_DATA_DIR = Join-Path $env:RUNNER_TEMP 'pyl2-smoke'
          $server = Start-Process python -ArgumentList '-m','app.main','--server-only','--port','8765' -PassThru
          try {
            Start-Sleep -Seconds 4
            python tools/smoke_test.py http://127.0.0.1:8765
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows release
        run: ./build.ps1 -OutDir dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
