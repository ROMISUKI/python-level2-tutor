name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate content
        shell: pwsh
        run: |
          python -u tools/validate_content.py 2>&1 | Tee-Object -FilePath validate.log
          $code = $LASTEXITCODE
          Get-Content validate.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Build Windows package
        run: ./build.ps1 -OutDir dist -Version ${{ github.ref_name }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $sha = Get-ChildItem dist/*.sha256 | Select-Object -First 1
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $zip.FullName $sha.FullName --clobber
            gh release edit $env:GITHUB_REF_NAME `
              --title "Python 二级通关 $env:GITHUB_REF_NAME" `
              --notes-file CHANGELOG.md
          } else {
            gh release create $env:GITHUB_REF_NAME `
              $zip.FullName `
              $sha.FullName `
              --title "Python 二级通关 $env:GITHUB_REF_NAME" `
              --notes-file CHANGELOG.md
          }
